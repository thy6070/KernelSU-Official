name: XY Manager

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'manager/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signing setup
        run: |
          echo "KEYSTORE_FILE=$PWD/.github/brand/signing.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$(cat .github/brand/pass.txt)" >> $GITHUB_ENV
          echo "KEY_ALIAS=key0" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(cat .github/brand/pass.txt)" >> $GITHUB_ENV

      - name: Build with Gradle
        run: |
          cd manager
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xy-latest
          name: 小鱼儿 官方版
          body: "官方 KernelSU + 小鱼儿 UI"
          files: manager/app/build/outputs/apk/release/*.apk
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: xy-manager-apk
          path: manager/app/build/outputs/apk/release/*.apk

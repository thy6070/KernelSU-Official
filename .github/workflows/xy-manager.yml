name: XY Manager

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref to build'
        required: false
        default: 'main'
        type: string
  push:
    branches: [ main ]
    paths:
      - 'manager/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Signing setup
        run: |
          echo "KEYSTORE_FILE=$PWD/.github/brand/signing.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$(cat .github/brand/pass.txt)" >> $GITHUB_ENV
          echo "KEY_ALIAS=xiaoyuer" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(cat .github/brand/pass.txt)" >> $GITHUB_ENV

      - name: Spoof namespace
        run: python3 .github/brand/spoof_ns.py

      - name: Build with Gradle
        run: |
          cp .github/brand/signing.jks manager/signing.jks
          export KEYSTORE_FILE="$(pwd)/manager/signing.jks"
          export KEYSTORE_PASSWORD="$(cat .github/brand/pass.txt)"
          export KEY_ALIAS="xiaoyuer"
          export KEY_PASSWORD="$(cat .github/brand/pass.txt)"
          cd manager
          chmod +x gradlew
          ./gradlew :app:assembleRelease -x lint \
            -PKEYSTORE_FILE="$KEYSTORE_FILE" \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      - name: Re-sign with xiaoyuer
        run: |
          for APK in manager/app/build/outputs/apk/release/*.apk; do
            BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
            $BT/apksigner sign --ks .github/brand/signing.jks \
              --ks-key-alias xiaoyuer \
              --ks-pass "pass:$(cat .github/brand/pass.txt)" \
              --key-pass "pass:$(cat .github/brand/pass.txt)" \
              "$APK"
          done

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xy-latest
          name: 小鱼儿 官方版
          body: "官方 KernelSU + 小鱼儿 UI"
          files: manager/app/build/outputs/apk/release/*.apk
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: xy-manager-apk
          path: manager/app/build/outputs/apk/release/*.apk
